[package]
name = "edupro_backend"
version = "0.1.0"
edition = "2021"


[lints.rust]



[dependencies]
axum = {version="0.8.8", features=["ws"]}
axum-extra = { version="0.12", features=["query", "multipart","cookie"]}
tower = "0.4"
tower-http = {version="0.6.6", features=["fs","cors"]}
tower-cookies = "0.11"
tower_governor = "0.6.0"



#Async Runtime
tokio = {version = "1", features=["full"]}

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with="3"

uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Database Related
sqlx = { version = "0.7",   features = ["runtime-tokio-rustls","postgres","macros","uuid","chrono","json","migrate"] }


# utils
futures-util = "0.3.31"


#Authentication
jsonwebtoken="9"


# Encryption
rand= "0.8"
hmac= "0.12"
sha2= "0.10"
base64-url= "2"



# Configs
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"


# Tracing

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
argon2 = "0.5.3"



#Efficiency

once_cell = "1.21.3"
cookie = "0.18.1"

[dev-dependencies]
anyhow = "1"
httpc-test = "0.1.1"

